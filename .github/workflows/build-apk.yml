name: Build Android APK

on:
  push:
    branches:
      - arena/01a0973c-medicines-stock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dukaan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          NOTES="Dukaan Medicos — Android debug APK. Built automatically from branch ${{ github.ref_name }} at commit ${{ github.sha }}."
          NOTES="$NOTES Install: download the APK, open it on your Android phone, and allow 'Install from unknown sources' if prompted."
          gh release delete apk-build --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create apk-build "$APK" --title "Dukaan Medicos — Android APK" --notes "$NOTES" --target "${{ github.sha }}"
